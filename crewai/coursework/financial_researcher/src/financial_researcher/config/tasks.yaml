research_task:
  description: >
    Conduct thorough and up-to-date research on company {company}. Focus on:
    1. Current company status and health and Founder name
    2. Historical company performance
    3. Major challenges and opportunities
    4. Recent news and events
    5. Future outlook and potential developments
    6. Employee reviews and overall employee sentiment
    7. Assess the company's suitability as a potential employer for a Cloud/IT professional
    8. Financial potential and investment attractiveness
    9. Any past relevant information or bad press that impacted the company's performance or reputation
    10. Company culture and work environment
    11. Technology stack-set
    12. Investment in company
    13. Current and future technology strategy
    14. Opportunities for technical growth and career development
    15. Job stability and company growth
    16. Compensation and benefits where reliable information is available
    17. Employee feedback about management and work-life balance
    18. Recent company announcements, financial performance, and strategic direction
    19. Competitor of the company and their market position.
    IMPORTANT: your information MUST be up to date and relevant to now, {current_date}.
    Make sure to organize your findings in a structured format with clear sections.
  expected_output: >
    A comprehensive research document with well-organized sections covering
    all the requested aspects of {company}. Include specific facts, figures,
    and examples where relevant.
  agent: researcher

analysis_task:
  description: >
    Analyze the research findings and create a comprehensive report on {company}.
    Your report should:
    1. Begin with an executive summary
    2. Include all key information from the research
    3. Provide insightful analysis of trends and patterns
    4. Offer a market outlook for company, noting that this should not be used for trading decisions
    5. Be formatted in a professional, easy-to-read style with clear headings
  expected_output: >
    A polished, professional report on {company} that presents the research
    findings with added analysis and insights. The report should be well-structured
    with an executive summary, main sections, and conclusion.
  agent: analyst
  context:
    - research_task
  output_file: output/report-1.md

presentation_task:
  description: >
    Using the company research produced by the Research Agent,
    create the content structure for a professional PowerPoint
    presentation.
    The presentation should contain as many slides as necessary to cover all key aspects of the research.
    Include:
    1. Company Overview
    2. Business and Market Position
    3. Employee Reviews and Company Culture
    4. Technology and IT Landscape
    5. Cloud / Infrastructure Strategy
    6. AI / Digital Transformation
    7. Future Technology Direction
    8. Opportunities for Cloud / DevOps / SRE professionals
    9. Career Growth and Job Stability
    10. Key Findings and Sources
    For every slide provide:
    - Slide title
    - 3-6 concise bullet points
    - Important facts or figures where available
    - Sources where appropriate
      Do not invent information.
      Clearly distinguish verified facts from employee opinions.
      Focus on concise presentation content rather than long explanations.
  expected_output: >
    A structured presentation containing as many slides as necessary to cover all key aspects of the research.
    Each slide must contain for {company}:
    - title
    - concise bullet points
    - relevant facts
    - source references where appropriate
  agent: presentation
  context:
    - research_task
  output_file: output/presentation.pptx

create_pptx_task:
  description: >
    Take the presentation content produced by the Presentation Agent
    and create the actual PowerPoint (.pptx) file.
    Use the available PowerPoint creation tool.
    The final presentation should:
    - Have a professional structure
    - Contain approximately 8-10 slides
    - Use concise content
    - Include the important findings from the research
    - Include sources where provided
    - Be readable and suitable for a professional audience
    - Do not perform new research.
    - Use the content provided by the Presentation Agent.
  expected_output: >
    A PowerPoint file named output/presentation.pptx containing the slides
    with the structured content provided.
  agent: create_pptx_agent
  context:
    - presentation_task
  output_file: output/presentation.pptx